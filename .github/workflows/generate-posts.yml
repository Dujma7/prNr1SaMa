name: Generate blog post pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: generate-posts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Use "npm install" instead if you have no package-lock.json
      - name: Install dependencies
        run: npm ci

      # REPLACE with the exact command you currently run manually
      - name: Generate pages
        run: npm run generate-posts
        env:
          # Only needed if your script reads from Sanity with these values
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add website/blog/post-*.html

          if git diff --cached --quiet; then
            echo "No changes to generated pages."
          else
            git commit -m "Generate blog post pages"
            git push
          fi
