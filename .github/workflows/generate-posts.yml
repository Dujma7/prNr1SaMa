name: Generate pages on Sanity publish

# Put this file at: .github/workflows/generate-pages.yml

on:
  repository_dispatch:
    types: [sanity-publish]   # triggered by the Sanity webhook
  workflow_dispatch:          # lets you also run it manually from GitHub

# If she publishes several times quickly, only the latest run counts
concurrency:
  group: generate-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Use "npm install" instead if you have no package-lock.json
      - name: Install dependencies
        run: npm ci

      # REPLACE with the exact command you currently run manually
      - name: Generate pages
        run: npm run generate-pages
        env:
          # Only needed if your script reads from Sanity with these values
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-generate pages from Sanity"
          git pull --rebase
          git push
