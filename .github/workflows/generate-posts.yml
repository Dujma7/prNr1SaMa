
name: Generate blog post pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate static blog pages
        run: node scripts/generate-posts.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add website/blog/post-*.html

          if git diff --cached --quiet; then
            echo "No changes to generated pages."
          else
            git commit -m "Generate blog post pages"
            git push
          fi
